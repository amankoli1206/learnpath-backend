<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnPath</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LearnPath</h1>
      <p>Personal Learning & Skill Tracker</p>
    </header>

    <main id="app-content">
      <!-- Auth Section -->
      <section id="auth-section" class="card">
        <h2>Sign In</h2>
        <form id="login-form">
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Continue</button>
        </form>
        <p class="toggle-text">Don't have an Apple ID? <span id="toggle-auth">Create yours now.</span></p>
        <div id="auth-error" class="error-msg"></div>
      </section>

      <!-- Dashboard Section (Hidden by default) -->
      <section id="dashboard-section" class="card hidden">
        <div class="dashboard-header">
          <h2>Your Skills</h2>
          <button id="logout-btn" class="secondary-btn">Sign Out</button>
        </div>
        
        <div class="skills-container" id="skills-list">
          <!-- Skills will be loaded here -->
        </div>

        <div class="add-skill-card">
          <h3>Add a New Skill</h3>
          <form id="add-skill-form">
            <input type="text" id="skill-name" placeholder="Skill Name (e.g. JavaScript)" required>
            <input type="text" id="skill-category" placeholder="Category (e.g. Programming)" required>
            <input type="text" id="skill-desc" placeholder="Description" required>
            <button type="submit">Save Skill</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
